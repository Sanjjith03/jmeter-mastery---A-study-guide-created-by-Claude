}

function initBuilder() {
  // palette
  const pal = document.getElementById('palette');
  pal.innerHTML = PALETTE.map(g => `
    <div style="margin-top:8px;">
      <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);margin:4px 0;">${g.group}</div>
      ${g.items.map(it => `<div class="palette-item" onclick='addNode(${JSON.stringify(it)})'><i class="ti ${it.icon}"></i>${it.label}</div>`).join('')}
    </div>
  `).join('');
  if (!TREE) TREE = defaultTree();
  if (!SELECTED) SELECTED = TREE.id;
  drawTree();
  updateBuilderOutputs();
}
function findNode(node, id, parent=null) {
  if (node.id === id) return { node, parent };
  for (const c of node.children || []) {
    const r = findNode(c, id, node);
    if (r) return r;
  }
  return null;
}
function addNode(spec) {
  if (!TREE) TREE = defaultTree();
  const r = findNode(TREE, SELECTED || TREE.id);
  if (!r) return;
  const parent = r.node;
  if (!parent.children) parent.children = [];
  parent.children.push({ id: nid(), kind: spec.t, label: spec.label, icon: spec.icon, ...spec, children: [] });
  drawTree();
  updateBuilderOutputs();
}
function deleteNode() {
  if (SELECTED === TREE.id) return;
  const r = findNode(TREE, SELECTED);
  if (!r || !r.parent) return;
  r.parent.children = r.parent.children.filter(c => c.id !== SELECTED);
  SELECTED = r.parent.id;
  drawTree();
  updateBuilderOutputs();
}
function moveNode(dir) {
  const r = findNode(TREE, SELECTED);
  if (!r || !r.parent) return;
  const arr = r.parent.children;
  const idx = arr.findIndex(c => c.id === SELECTED);
  const tgt = idx + dir;
  if (tgt < 0 || tgt >= arr.length) return;
  [arr[idx], arr[tgt]] = [arr[tgt], arr[idx]];
  drawTree();
  updateBuilderOutputs();
}
function clearTree() {
  TREE = { id: nid(), kind: 'plan', label: 'Test Plan', icon: 'ti-file', children: [] };
  SELECTED = TREE.id;
  drawTree();
  updateBuilderOutputs();
}
function selectNode(id) { SELECTED = id; drawTree(); updateBuilderOutputs(); }
function drawTree() {
  const out = document.getElementById('builderTree');
  function render(node, depth) {
    const sel = node.id === SELECTED ? 'selected' : '';
    return `<div class="tree-node ${sel}" onclick="selectNode(${node.id})" style="padding-left:${depth*16+8}px;">
      <i class="ti ${node.icon}"></i><span>${node.label}</span>
    </div>` + (node.children||[]).map(c => render(c, depth+1)).join('');
  }
  out.innerHTML = render(TREE, 0);
}
function countSamples(node, mult) {
  let total = 0;
  let predictions = [];
  const visit = (n, multiplier) => {
    if (!n) return;
    let m = multiplier;
    if (n.kind === 'tg' || n.kind === 'setup' || n.kind === 'teardown') {
      m = (n.threads||1) * (n.loops||1);
      predictions.push(`${n.label}: ${n.threads||1} threads × ${n.loops||1} loops = ${m} iterations`);
    } else if (n.kind === 'loop') {
      m = m * (n.loops || 1);
      predictions.push(`${n.label}: ×${n.loops||1}`);
    } else if (n.kind === 'foreach') {
      m = m * (n.N || 5);
      predictions.push(`${n.label}: ×${n.N||5}`);
    } else if (n.kind === 'throughput') {
      m = m * ((n.pct||50)/100);
      predictions.push(`${n.label}: ×${(n.pct||50)/100}`);
    } else if (n.kind === 'http' || n.kind === 'jdbc' || n.kind === 'jsr223' || n.kind === 'debug' || n.kind === 'tcp') {
      total += m;
    }
    for (const c of (n.children||[])) visit(c, m);
  };
  visit(node, 1);
  return { total: Math.round(total), predictions };
}
function getThreadTotal() {
  let t = 0;
  const visit = (n) => {
    if (n.kind === 'tg' || n.kind === 'setup' || n.kind === 'teardown') t += (n.threads||1);
    for (const c of (n.children||[])) visit(c);
  };
  visit(TREE);
  return t;
}
function updateBuilderOutputs() {
  if (!TREE) return;
  const { total, predictions } = countSamples(TREE);
  document.getElementById('bSamples').textContent = total;
  document.getElementById('bThreads').textContent = getThreadTotal();
  document.getElementById('bPredictDetail').innerHTML = predictions.length
    ? '<ul style="margin-left:18px;">' + predictions.map(p => `<li>${p}</li>`).join('') + '</ul>'
    : '<p style="color:var(--text-muted);">Add a thread group and a sampler to see the prediction.</p>';
  document.getElementById('bJmxOut').innerHTML = highlightXml(toJmx(TREE));
  const r = findNode(TREE, SELECTED);
  document.getElementById('bDoc').innerHTML = r ? nodeDoc(r.node) : '';
}
function nodeDoc(n) {
  const docs = {
    plan: 'Root Test Plan. Holds plan-level UDVs and library jars. Children execute in tree order.',
    tg: 'Standard Thread Group. Threads start sequentially over ramp-up. Configure loop count to limit iterations.',

  return `<strong>${n.label}</strong><p style="margin-top:6px;color:var(--text-muted);">${docs[n.kind] || ''}</p>`;
}
function toJmx(node, depth=0) {
  if (!node) return '';
  const indent = '  '.repeat(depth);
  let xml = '';
  if (node.kind === 'plan') {
    xml += `${indent}<TestPlan testname="${esc(node.label)}">\n`;
    for (const c of (node.children||[])) xml += toJmx(c, depth+1);
    xml += `${indent}</TestPlan>\n`;
  } else if (node.kind === 'tg' || node.kind === 'setup' || node.kind === 'teardown') {
    const tag = node.kind === 'setup' ? 'SetupThreadGroup' : node.kind === 'teardown' ? 'PostThreadGroup' : 'ThreadGroup';
    xml += `${indent}<${tag} testname="${esc(node.label)}">\n`;
    xml += `${indent}  <stringProp name="ThreadGroup.num_threads">${node.threads||1}</stringProp>\n`;
    xml += `${indent}  <stringProp name="ThreadGroup.ramp_time">${node.ramp||0}</stringProp>\n`;
    xml += `${indent}  <stringProp name="LoopController.loops">${node.loops||1}</stringProp>\n`;
    xml += `${indent}  <hashTree>\n`;
    for (const c of (node.children||[])) xml += toJmx(c, depth+2);
    xml += `${indent}  </hashTree>\n`;
    xml += `${indent}</${tag}>\n`;
  } else if (node.kind === 'http') {
    xml += `${indent}<HTTPSamplerProxy testname="${esc(node.label)}">\n`;
    xml += `${indent}  <stringProp name="HTTPSampler.method">${node.method||'GET'}</stringProp>\n`;
    xml += `${indent}  <stringProp name="HTTPSampler.path">${esc(node.path||'/')}</stringProp>\n`;
    xml += `${indent}</HTTPSamplerProxy>\n`;
  } else {
    const tag = ({
      simple:'GenericController', loop:'LoopController', if:'IfController', while:'WhileController',
      foreach:'ForeachController', txn:'TransactionController', once:'OnceOnlyController', throughput:'ThroughputController',
      jdbc:'JDBCSampler', jsr223:'JSR223Sampler', debug:'DebugSampler', tcp:'TCPSampler',
      tconst:'ConstantTimer', tgauss:'GaussianRandomTimer', tunif:'UniformRandomTimer', tthr:'ConstantThroughputTimer',
      aResp:'ResponseAssertion', aJson:'JSONPathAssertion', aDur:'DurationAssertion',
      csv:'CSVDataSet', header:'HeaderManager', defaults:'ConfigTestElement', cookie:'CookieManager', udv:'Arguments',
      preJsr:'JSR223PreProcessor', extRegex:'RegexExtractor', extJson:'JSONPostProcessor', extBound:'BoundaryExtractor',
      lstSummary:'SummaryReport', lstAgg:'StatVisualizer', lstSdw:'ResultCollector', lstBackend:'BackendListener',
    })[node.kind] || 'Element';
    xml += `${indent}<${tag} testname="${esc(node.label)}"`;
    if (node.kind === 'loop') xml += `><stringProp name="LoopController.loops">${node.loops||1}</stringProp`;
    if (node.kind === 'if') xml += `><stringProp name="IfController.condition">${esc(node.cond||'')}</stringProp`;
    if (node.kind === 'while') xml += `><stringProp name="WhileController.condition">${esc(node.cond||'')}</stringProp`;
    if (node.kind === 'throughput') xml += `><stringProp name="ThroughputController.percentThrougput">${node.pct||50}</stringProp`;
    xml += `>\n`;
    if (node.children && node.children.length) {
      xml += `${indent}  <hashTree>\n`;
      for (const c of node.children) xml += toJmx(c, depth+2);
      xml += `${indent}  </hashTree>\n`;
    }
    xml += `${indent}</${tag}>\n`;
  }
  return xml;
}

function initCsvVisualizer() {
  ['csvThreads','csvRows','csvIter'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById('csvT').textContent = document.getElementById('csvThreads').value;
      document.getElementById('csvR').textContent = document.getElementById('csvRows').value;
      document.getElementById('csvI').textContent = document.getElementById('csvIter').value;
    });
  });
  runCsvAlloc();
}
function runCsvAlloc() {
  const T = +document.getElementById('csvThreads').value;
  const R = +document.getElementById('csvRows').value;
  const I = +document.getElementById('csvIter').value;
  const share = document.getElementById('csvShare').value;
  const recycle = document.getElementById('csvRecycle').value === 'true';
  // allocate rows
  const grid = [];
  if (share === 'all') {
    let p = 0; let done = false;
    for (let it = 0; it < I && !done; it++) {
      const row = [];
      for (let t = 0; t < T && !done; t++) {
        if (p >= R) {
          if (recycle) p = 0; else { row.push(null); done = true; continue; }
        }
        row.push(p+1); p++;
      }
      grid.push(row);
    }
    // pad remaining iterations with EOF
    while (grid.length < I) grid.push(new Array(T).fill(null));
  } else { // per-thread
    for (let it = 0; it < I; it++) {
      const row = [];
      for (let t = 0; t < T; t++) {
        let p = (it) % R;
        if (it >= R && !recycle) row.push(null);
        else row.push(p+1);
      }
      grid.push(row);
    }
  }
  let html = '<table class="tbl"><thead><tr><th>Iter / Thread</th>';
  for (let t = 0; t < T; t++) html += `<th>T${t+1}</th>`;
  html += '</tr></thead><tbody>';
  for (let it = 0; it < I; it++) {
    html += `<tr><td><strong>Iter ${it+1}</strong></td>`;
    for (let t = 0; t < T; t++) {
      const v = grid[it][t];
      html += `<td style="text-align:center;">${v ? `<span class="pill blue">row ${v}</span>` : '<span class="pill red">EOF</span>'}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('csvGrid').innerHTML = html;
}

function initCliBuilder() {
  document.getElementById('cliDist').addEventListener('change', () => {
    document.getElementById('cliSlavesWrap').style.display = document.getElementById('cliDist').value === '-R' ? '' : 'none';
    buildCli();
  });
  buildCli();
}
function buildCli() {
  const jmx = document.getElementById('cliJmx').value.trim() || 'plan.jmx';
  const jtl = document.getElementById('cliJtl').value.trim();
  const rep = document.getElementById('cliRep').value.trim();
  const log = document.getElementById('cliLog').value;
  const dist = document.getElementById('cliDist').value;
  const slaves = document.getElementById('cliSlaves').value;
  const jPairs = document.getElementById('cliJ').value.split('\n').filter(Boolean);
  const gPairs = document.getElementById('cliG').value.split('\n').filter(Boolean);
  let cmd = `jmeter -n -t ${jmx}`;
  if (jtl) cmd += ` \\\n  -l ${jtl}`;
  if (rep) cmd += ` \\\n  -e -o ${rep}`;
  if (dist === '-r') cmd += ` \\\n  -r`;
  if (dist === '-R') cmd += ` \\\n  -R ${slaves}`;
  if (log) cmd += ` \\\n  -L ${log}`;
  for (const j of jPairs) cmd += ` \\\n  -J${j.trim()}`;
  for (const g of gPairs) cmd += ` \\\n  -G${g.trim()}`;
  document.getElementById('cliOut').innerHTML = highlightBash(cmd);
}

registerPage('quiz', `
  <div class="page-header">
    <h1 class="page-title"><i class="ti ti-help-octagon"></i> Self-Quiz</h1>
    <p class="page-subtitle">50 questions across all topics. Instant explanations. Weak-area analysis at the end.</p>
  </div>

  <div class="card" id="quizCard" style="margin-bottom:18px;">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;">
        <div class="progress"><div class="progress-fill" id="qProg" style="width:0%;"></div></div>
      </div>
      <div style="font-size:13px;color:var(--text-muted);">
        Q <strong id="qNum">1</strong> / ${QUIZ.length} · Score: <strong id="qScore">0</strong>
      </div>
      <button class="btn sm" onclick="resetQuiz()"><i class="ti ti-refresh"></i> Reset</button>
    </div>
    <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:0;" id="qDots"></div>
    <div style="margin-top:14px;">
      <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;" id="qCat"></div>
      <div class="quiz-q" id="qText"></div>
      <div id="qOpts"></div>
      <div id="qExplain" style="margin-top:10px;"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn" onclick="qPrev()" id="qPrevBtn"><i class="ti ti-chevron-left"></i> Prev</button>
        <button class="btn primary" onclick="qNext()" id="qNextBtn">Next <i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <div id="quizSummary" style="display:none;"></div>
`);

let QSTATE = { idx: 0, answers: {}, };

function initQuiz() {
  if (Object.keys(QSTATE.answers).length === 0) QSTATE.idx = 0;
  drawQuiz();
}
function resetQuiz() {
  QSTATE = { idx: 0, answers: {} };
  document.getElementById('quizSummary').style.display = 'none';
  document.getElementById('quizCard').style.display = '';
  drawQuiz();
}
function drawQuiz() {
  const q = QUIZ[QSTATE.idx];
  document.getElementById('qNum').textContent = QSTATE.idx + 1;
  document.getElementById('qProg').style.width = ((QSTATE.idx + 1) / QUIZ.length * 100) + '%';
  const score = Object.entries(QSTATE.answers).filter(([k,v]) => QUIZ[+k].a === v).length;
  document.getElementById('qScore').textContent = score;
  document.getElementById('qCat').textContent = q.c;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qDots').innerHTML = QUIZ.map((_, i) => {
    let cls = 'qdot';
    if (i === QSTATE.idx) cls += ' current';
    if (QSTATE.answers[i] !== undefined) {
      cls += QUIZ[i].a === QSTATE.answers[i] ? ' correct' : ' wrong';
    }
    return `<div class="${cls}" onclick="qJump(${i})" title="Q${i+1}">${i+1}</div>`;
  }).join('');
  const answered = QSTATE.answers[QSTATE.idx] !== undefined;
  document.getElementById('qOpts').innerHTML = q.o.map((opt, i) => {
    let cls = 'quiz-opt';
    if (answered) {
      cls += ' disabled';
      if (i === q.a) cls += ' correct';
      else if (i === QSTATE.answers[QSTATE.idx]) cls += ' wrong';
    }
    return `<div class="${cls}" onclick="qPick(${i})"><strong>${String.fromCharCode(65+i)}.</strong> ${opt}</div>`;
  }).join('');
  document.getElementById('qExplain').innerHTML = answered ? `
    <div class="callout callout-${QUIZ[QSTATE.idx].a === QSTATE.answers[QSTATE.idx] ? 'tip' : 'danger'}">
      <i class="ti ${QUIZ[QSTATE.idx].a === QSTATE.answers[QSTATE.idx] ? 'ti-circle-check' : 'ti-circle-x'}"></i>
      <div><strong>${QUIZ[QSTATE.idx].a === QSTATE.answers[QSTATE.idx] ? 'Correct!' : 'Not quite.'}</strong> ${q.e}</div>
    </div>` : '';
  document.getElementById('qPrevBtn').disabled = QSTATE.idx === 0;
  document.getElementById('qNextBtn').textContent = (QSTATE.idx === QUIZ.length - 1) ? 'Finish' : 'Next';
}
function qPick(i) {
  if (QSTATE.answers[QSTATE.idx] !== undefined) return;
  QSTATE.answers[QSTATE.idx] = i;
  drawQuiz();
}
function qPrev() { if (QSTATE.idx > 0) { QSTATE.idx--; drawQuiz(); } }
function qNext() {
  if (QSTATE.idx === QUIZ.length - 1) { showSummary(); return; }
  QSTATE.idx++; drawQuiz();
}
function qJump(i) { QSTATE.idx = i; drawQuiz(); }
function showSummary() {
  document.getElementById('quizCard').style.display = 'none';
  const cats = {};
  QUIZ.forEach((q, i) => {
    if (!cats[q.c]) cats[q.c] = { total: 0, correct: 0 };
    cats[q.c].total++;
    if (QSTATE.answers[i] === q.a) cats[q.c].correct++;
  });
  const totalCorrect = Object.values(cats).reduce((s,c) => s + c.correct, 0);
  const pct = Math.round(100 * totalCorrect / QUIZ.length);
  const weak = Object.entries(cats).filter(([_,c]) => c.correct/c.total < 0.7).map(([k]) => k);
  document.getElementById('quizSummary').style.display = 'block';
  document.getElementById('quizSummary').innerHTML = `
    <div class="hero">
      <h1>Quiz complete</h1>
      <p>You scored <strong>${totalCorrect}/${QUIZ.length}</strong> (${pct}%).</p>
      <div class="stats">
        ${Object.entries(cats).map(([c,o]) => `
          <div class="stat"><strong>${o.correct}/${o.total}</strong><span>${c}</span></div>
        `).join('')}
      </div>
    </div>
    <h2 style="font-size:18px;margin:18px 0 10px;">Performance by category</h2>
    <div class="grid grid-2">
      ${Object.entries(cats).map(([c,o]) => {
        const p = 100 * o.correct / o.total;
        const color = p >= 80 ? 'var(--success)' : p >= 50 ? 'var(--warn)' : 'var(--danger)';
        return `
          <div class="card">
            <h3>${c}</h3>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="progress" style="flex:1;"><div class="progress-fill" style="width:${p}%;background:${color};"></div></div>
              <span style="font-size:13px;font-weight:600;">${o.correct}/${o.total}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    ${weak.length ? `<div class="callout callout-warn" style="margin-top:16px;"><i class="ti ti-target"></i><div><strong>Weak areas:</strong> ${weak.join(', ')}. Revisit these sections — they had &lt;70% accuracy.</div></div>` : ''}
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn primary" onclick="resetQuiz()"><i class="ti ti-refresh"></i> Retake</button>
      <button class="btn" onclick="navigate('home')"><i class="ti ti-home"></i> Back to dashboard</button>
    </div>
  `;
}

      <tr><td>"Save only failing" missing samples in dashboard</td><td>HTML dashboard needs all samples — use Simple Data Writer with default fields and "Save Errors Only" off.</td></tr>
    </tbody>
  </table>
`);

registerPage('glossary', `
  <div class="page-header">
    <h1 class="page-title"><i class="ti ti-book"></i> Glossary</h1>
    <p class="page-subtitle">A–Z reference for every JMeter term in this dashboard.</p>
  </div>

  <div class="toolbar"><div class="search-box"><i class="ti ti-search"></i><input type="text" id="glossSearch" placeholder="Search glossary..." oninput="renderGlossary()"></div></div>
  <div id="glossList"></div>
`);

function initGlossary() { renderGlossary(); }
function renderGlossary() {
  const q = (document.getElementById('glossSearch')?.value || '').toLowerCase();
  const filtered = GLOSSARY.filter(([k,v]) => !q || k.toLowerCase().includes(q) || v.toLowerCase().includes(q));
  const groups = {};
  for (const [k,v] of filtered) {
    const L = k[0].toUpperCase();
    if (!groups[L]) groups[L] = [];
    groups[L].push([k,v]);
  }
  const letters = Object.keys(groups).sort();
  document.getElementById('glossList').innerHTML = letters.map(L => `
    <div class="glossary-letter">${L}</div>
    <div class="grid grid-2">
      ${groups[L].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v]) => `
        <div class="card">
          <h3 style="margin-bottom:4px;">${k}</h3>
          <p style="font-size:13px;">${v}</p>
        </div>
      `).join('')}
    </div>
  `).join('') || '<p style="color:var(--text-muted);padding:20px;text-align:center;">No results.</p>';
}
