<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMeter Mastery — Interactive Learning Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css">
<style>
/* ============== CSS VARIABLES / THEME ============== */
:root {
  --bg: #ffffff;
  --bg-alt: #f7f8fa;
  --bg-elev: #ffffff;
  --text: #1a1d23;
  --text-muted: #5d6470;
  --text-faint: #8a92a0;
  --border: #e4e7ec;
  --border-strong: #d0d5dd;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --accent-text: #1d4ed8;
  --success: #16a34a;
  --success-soft: #ecfdf5;
  --warn: #d97706;
  --warn-soft: #fffbeb;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --info: #0891b2;
  --info-soft: #ecfeff;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;
  --pink: #db2777;
  --pink-soft: #fdf2f8;
  --code-bg: #f4f5f7;
  --code-text: #1a1d23;
  --code-keyword: #7c3aed;
  --code-string: #16a34a;
  --code-number: #d97706;
  --code-tag: #dc2626;
  --code-attr: #2563eb;
  --shadow-sm: 0 1px 2px rgba(16,24,40,0.04);
  --shadow: 0 1px 3px rgba(16,24,40,0.06);
  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  --sidebar-w: 240px;
  --transition: 0.18s ease;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --bg-alt: #161b22;
  --bg-elev: #161b22;
  --text: #e6edf3;
  --text-muted: #9da7b3;
  --text-faint: #6e7681;
  --border: #21262d;
  --border-strong: #30363d;
  --accent: #58a6ff;
  --accent-soft: #1f2937;
  --accent-text: #79b8ff;
  --success: #3fb950;
  --success-soft: #0f2419;
  --warn: #d29922;
  --warn-soft: #2a210a;
  --danger: #f85149;
  --danger-soft: #2a0d0d;
  --info: #39c5cf;
  --info-soft: #0c2528;
  --purple: #a371f7;
  --purple-soft: #1d1a2e;
  --pink: #f778ba;
  --pink-soft: #2a1424;
  --code-bg: #0d1117;
  --code-text: #e6edf3;
  --code-keyword: #ff7b72;
  --code-string: #a5d6ff;
  --code-number: #79c0ff;
  --code-tag: #7ee787;
  --code-attr: #d2a8ff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 2px 4px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: "SF Mono", "Monaco", "Menlo", "Consolas", "Liberation Mono", monospace; font-size: 12.5px; }

/* ============== LAYOUT ============== */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-alt);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
  transition: transform var(--transition);
}
.sidebar-brand {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-brand .logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 700; font-size: 15px;
}
.sidebar-brand .name { font-weight: 700; font-size: 14px; }
.sidebar-brand .sub { font-size: 11px; color: var(--text-muted); }
.nav-section { padding: 10px 8px 4px; }
.nav-section-title {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-faint);
  padding: 4px 10px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; margin: 1px 0;
  border-radius: var(--radius-sm);
  color: var(--text-muted); cursor: pointer;
  font-size: 13px; transition: background var(--transition), color var(--transition);
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
.nav-item i { font-size: 16px; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto; font-size: 10px;
  background: var(--border); color: var(--text-muted);
  padding: 1px 6px; border-radius: 10px; font-weight: 600;
}
.nav-item.active .badge { background: var(--accent); color: white; }

.main {
  flex: 1; margin-left: var(--sidebar-w);
  min-width: 0;
}
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 12px;
}
.topbar .menu-btn {
  display: none;
  background: none; border: 1px solid var(--border);
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  color: var(--text); cursor: pointer;
  align-items: center; justify-content: center;
}
.topbar .crumbs { font-size: 13px; color: var(--text-muted); flex: 1; }
.topbar .crumbs strong { color: var(--text); }
.topbar .theme-btn {
  background: var(--bg-alt); border: 1px solid var(--border);
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.topbar .theme-btn:hover { background: var(--bg-elev); border-color: var(--border-strong); }

.page-wrap { max-width: 1400px; margin: 0 auto; padding: 24px 28px 80px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.22s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.page-header { margin-bottom: 24px; }
.page-title {
  font-size: 26px; font-weight: 700; margin-bottom: 6px;
  display: flex; align-items: center; gap: 12px;
}
.page-title i {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent-text);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.page-subtitle { color: var(--text-muted); font-size: 14.5px; max-width: 800px; }

/* ============== CARDS & GRID ============== */
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid-auto-lg { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
@media (max-width: 900px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: border-color var(--transition);
}
.card:hover { border-color: var(--border-strong); }
.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.card h3 i { font-size: 18px; }
.card p { color: var(--text-muted); font-size: 13.5px; }
.card .meta { font-size: 12px; color: var(--text-faint); margin-top: 8px; }

.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--accent); }

.card-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 10px;
}
.icon-blue { background: var(--accent-soft); color: var(--accent-text); }
.icon-green { background: var(--success-soft); color: var(--success); }
.icon-amber { background: var(--warn-soft); color: var(--warn); }
.icon-red { background: var(--danger-soft); color: var(--danger); }
.icon-cyan { background: var(--info-soft); color: var(--info); }
.icon-purple { background: var(--purple-soft); color: var(--purple); }
.icon-pink { background: var(--pink-soft); color: var(--pink); }
.icon-gray { background: var(--bg-alt); color: var(--text-muted); }

/* ============== HERO ============== */
.hero {
  background: linear-gradient(135deg, var(--accent-soft) 0%, var(--purple-soft) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px 28px;
  margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -50%; right: -10%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
  opacity: 0.08; pointer-events: none;
}
.hero h1 { font-size: 30px; margin-bottom: 8px; font-weight: 700; position: relative; }
.hero p { font-size: 15px; color: var(--text-muted); max-width: 720px; position: relative; }
.hero .stats { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; position: relative; }
.hero .stat strong { font-size: 22px; font-weight: 700; display: block; color: var(--text); }
.hero .stat span { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

/* ============== CALLOUTS ============== */
.callout {
  border-left: 3px solid;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 13.5px;
  display: flex; gap: 10px; align-items: flex-start;
}
.callout i { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.callout-tip { background: var(--success-soft); border-color: var(--success); color: var(--text); }
.callout-tip i { color: var(--success); }
.callout-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--text); }
.callout-warn i { color: var(--warn); }
.callout-danger { background: var(--danger-soft); border-color: var(--danger); color: var(--text); }
.callout-danger i { color: var(--danger); }
.callout-info { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.callout-info i { color: var(--accent); }

/* ============== TAGS / PILLS ============== */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 10px;
  background: var(--bg-alt); color: var(--text-muted);
  border: 1px solid var(--border);
}
.pill.blue { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.pill.green { background: var(--success-soft); color: var(--success); border-color: transparent; }
.pill.amber { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.red { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.purple { background: var(--purple-soft); color: var(--purple); border-color: transparent; }
.pill.pink { background: var(--pink-soft); color: var(--pink); border-color: transparent; }
.pill.cyan { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }

/* ============== CODE BLOCK ============== */
pre.code {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  overflow-x: auto;
  font-size: 12.5px; line-height: 1.5;
  color: var(--code-text);
  margin: 10px 0;
}
pre.code .k { color: var(--code-keyword); }
pre.code .s { color: var(--code-string); }
pre.code .n { color: var(--code-number); }
pre.code .t { color: var(--code-tag); }
pre.code .a { color: var(--code-attr); }
pre.code .c { color: var(--text-faint); font-style: italic; }
code.inline {
  background: var(--code-bg);
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-size: 12.5px;
}

/* ============== TABLES ============== */
table.tbl {
  width: 100%; border-collapse: collapse;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 12px 0; font-size: 13px;
}
table.tbl th {
  background: var(--bg-alt);
  text-align: left; padding: 10px 12px;
  font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.03em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
table.tbl td {
  padding: 10px 12px; border-top: 1px solid var(--border);
  vertical-align: top;
}
table.tbl tr:hover td { background: var(--bg-alt); }

/* ============== SEARCH + FILTERS ============== */
.toolbar {
  display: flex; gap: 10px; margin-bottom: 16px;
  flex-wrap: wrap; align-items: center;
}
.search-box {
  flex: 1; min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%; padding: 8px 12px 8px 34px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text);
  outline: none; transition: border-color var(--transition);
}
.search-box input:focus { border-color: var(--accent); }
.search-box i {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--text-faint); font-size: 16px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  padding: 5px 11px; font-size: 12px; font-weight: 500;
  background: var(--bg-alt); color: var(--text-muted);
  border: 1px solid var(--border); border-radius: 14px;
  cursor: pointer; transition: all var(--transition);
}
.filter-pill:hover { color: var(--text); border-color: var(--border-strong); }
.filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

/* ============== EXPANDABLE / DETAILS ============== */
.expand {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.expand-head {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
  transition: background var(--transition);
}
.expand-head:hover { background: var(--bg-alt); }
.expand-head .chev { margin-left: auto; transition: transform var(--transition); color: var(--text-faint); }
.expand.open .expand-head .chev { transform: rotate(90deg); }
.expand-head h4 { font-size: 14.5px; font-weight: 600; }
.expand-head .desc { font-size: 12.5px; color: var(--text-muted); margin-left: 4px; }
.expand-body {
  display: none; padding: 4px 16px 16px;
  border-top: 1px solid var(--border);
}
.expand.open .expand-body { display: block; }

/* ============== TABS ============== */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
.tab {
  padding: 8px 14px; font-size: 13px; font-weight: 500;
  color: var(--text-muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; font-size: 13px; font-weight: 500;
  background: var(--bg-elev); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition);
}
.btn:hover { background: var(--bg-alt); border-color: var(--border-strong); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-text); }
.btn.success { background: var(--success); color: white; border-color: var(--success); }
.btn.danger { background: var(--danger); color: white; border-color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.icon { padding: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============== FORM CONTROLS ============== */
.input, select.input, textarea.input {
  width: 100%; padding: 7px 10px;
  background: var(--bg-elev); color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit;
  outline: none; transition: border-color var(--transition);
}
.input:focus { border-color: var(--accent); }
textarea.input { font-family: "SF Mono", monospace; font-size: 12.5px; resize: vertical; min-height: 80px; }
label.field { display: block; margin-bottom: 10px; }
label.field > span { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  background: var(--border); border-radius: 2px;
  outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg);
}

/* ============== PROGRESS BAR ============== */
.progress {
  width: 100%; height: 6px;
  background: var(--border);
  border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  transition: width 0.3s ease;
}

/* ============== SVG VISUAL ============== */
.svg-canvas {
  width: 100%; background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius); margin: 10px 0;
}

/* ============== SCOPE / SCROLLBAR ============== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

/* ============== RESPONSIVE ============== */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar .menu-btn { display: inline-flex; }
  .page-wrap { padding: 16px; }
  .hero { padding: 20px 18px; }
  .hero h1 { font-size: 22px; }
}

/* ============== SPECIFIC COMPONENTS ============== */
.kbd {
  display: inline-block;
  padding: 1px 6px; font-size: 11px; font-family: monospace;
  background: var(--bg-alt); border: 1px solid var(--border-strong);
  border-radius: 4px; box-shadow: 0 1px 0 var(--border-strong);
}
.dots { display: inline-flex; gap: 2px; }
.dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.dots .dot.on { background: var(--accent); }
.dots .dot.on.red { background: var(--danger); }
.dots .dot.on.amber { background: var(--warn); }
.dots .dot.on.green { background: var(--success); }

.metric {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 12px;
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.metric strong { font-size: 18px; font-weight: 700; }
.metric span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

.timeline-event {
  padding: 6px 10px; font-size: 12px; font-family: monospace;
  border-left: 2px solid var(--accent);
  background: var(--bg-alt); margin: 4px 0;
  border-radius: 0 4px 4px 0;
}
.timeline-event.skip { border-color: var(--text-faint); color: var(--text-muted); }
.timeline-event.enter { border-color: var(--success); }
.timeline-event.exit { border-color: var(--danger); }
.timeline-event.sample { border-color: var(--accent); }
.timeline-event.decide { border-color: var(--warn); }

.tree-node {
  padding: 4px 8px; margin: 1px 0;
  font-size: 13px; cursor: pointer;
  border-radius: 4px; display: flex; align-items: center; gap: 6px;
}
.tree-node:hover { background: var(--bg-alt); }
.tree-node.selected { background: var(--accent-soft); color: var(--accent-text); }
.tree-node .indent { display: inline-block; }
.tree-node i { font-size: 14px; }

.quiz-q { font-size: 16px; font-weight: 500; margin-bottom: 14px; }
.quiz-opt {
  padding: 10px 14px; margin: 6px 0;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: all var(--transition);
}
.quiz-opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.quiz-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.quiz-opt.correct { border-color: var(--success); background: var(--success-soft); }
.quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.quiz-opt.disabled { cursor: default; }
.qdot {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--border); display: inline-flex;
  align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; margin: 2px;
}
.qdot.answered { background: var(--accent); color: white; }
.qdot.current { box-shadow: 0 0 0 2px var(--accent); }
.qdot.correct { background: var(--success); color: white; }
.qdot.wrong { background: var(--danger); color: white; }

.glossary-letter {
  position: sticky; top: 56px;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 8px 0; font-weight: 700; font-size: 16px;
  color: var(--accent);
}

.console-log {
  background: #0d1117; color: #c9d1d9;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: monospace; font-size: 12px;
  max-height: 300px; overflow-y: auto;
  border: 1px solid var(--border-strong);
}
.console-log .line { white-space: pre; }
.console-log .ok { color: #3fb950; }
.console-log .err { color: #f85149; }
.console-log .warn { color: #d29922; }
.console-log .info { color: #58a6ff; }
.console-log .gray { color: #6e7681; }

.histogram-bar {
  background: var(--accent); border-radius: 2px 2px 0 0;
  transition: height 0.3s ease;
}

.thread-block {
  position: absolute; height: 4px;
  background: var(--accent); border-radius: 2px;
  opacity: 0.6;
}

.demo-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.demo-controls { flex: 0 0 280px; min-width: 250px; }
.demo-output { flex: 1; min-width: 300px; }

.palette-item {
  padding: 7px 10px; margin: 3px 0;
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 12.5px;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all var(--transition);
}
.palette-item:hover { background: var(--accent-soft); border-color: var(--accent); }
.palette-item i { font-size: 14px; color: var(--text-muted); }

.builder-tree {
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  min-height: 300px; max-height: 500px; overflow-y: auto;
}

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse { animation: pulse 1.4s ease-in-out infinite; }

@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
</style>

    </header>

  </main>

<script>
/* ============== NAV STRUCTURE ============== */
const NAV = [
  { group: 'Overview', items: [
    { id: 'home', label: 'Home', icon: 'ti-home' },
    { id: 'fundamentals', label: 'Fundamentals', icon: 'ti-book-2' },
  ]},
  { group: 'Core Elements', items: [
    { id: 'threadgroups', label: 'Thread Groups', icon: 'ti-versions', badge: '8' },
    { id: 'samplers', label: 'Samplers', icon: 'ti-target', badge: '20+' },
    { id: 'controllers', label: 'Controllers', icon: 'ti-route', badge: '16' },
    { id: 'listeners', label: 'Listeners', icon: 'ti-chart-line', badge: '18' },
    { id: 'timers', label: 'Timers', icon: 'ti-clock', badge: '10' },
    { id: 'assertions', label: 'Assertions', icon: 'ti-checks', badge: '12' },
    { id: 'preprocs', label: 'Pre-processors', icon: 'ti-arrow-left-bar', badge: '10' },
    { id: 'postprocs', label: 'Post-processors', icon: 'ti-arrow-right-bar', badge: '12' },
    { id: 'configs', label: 'Config Elements', icon: 'ti-settings', badge: '15+' },
    { id: 'functions', label: 'Functions', icon: 'ti-function', badge: '50+' },
  ]},
  { group: 'Interactive', items: [
    { id: 'builder', label: 'Test Plan Builder', icon: 'ti-sitemap' },
    { id: 'recording', label: 'Recording & Correl.', icon: 'ti-device-desktop' },
    { id: 'paramz', label: 'Parameterization', icon: 'ti-variable' },
    { id: 'distributed', label: 'Distributed Testing', icon: 'ti-network' },
    { id: 'cli', label: 'Non-GUI / CI/CD', icon: 'ti-terminal-2' },
  ]},
  { group: 'Mastery', items: [
    { id: 'perf', label: 'Performance & BP', icon: 'ti-rocket' },
    { id: 'plugins', label: 'Plugins', icon: 'ti-puzzle' },
    { id: 'monitoring', label: 'Monitoring', icon: 'ti-activity' },
    { id: 'recipes', label: 'Patterns & Recipes', icon: 'ti-tools' },
  ]},
  { group: 'Reference', items: [
    { id: 'quiz', label: 'Self-Quiz', icon: 'ti-help-octagon', badge: '50' },
    { id: 'cheatsheet', label: 'Cheat Sheets', icon: 'ti-bookmark' },
    { id: 'glossary', label: 'Glossary', icon: 'ti-book' },
  ]},
];

/* ============== STATE ============== */
const STATE = { current: 'home', theme: 'light' };

/* ============== INIT ============== */
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(g => `
    <div class="nav-section">
      <div class="nav-section-title">${g.group}</div>
      ${g.items.map(it => `
        <div class="nav-item" data-page="${it.id}" onclick="navigate('${it.id}')">
          <i class="ti ${it.icon}"></i>
          <span>${it.label}</span>
          ${it.badge ? `<span class="badge">${it.badge}</span>` : ''}
        </div>
      `).join('')}
    </div>
  `).join('');
}
function navigate(id) {
  STATE.current = id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === id));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
  let label = '';
  for (const g of NAV) for (const it of g.items) if (it.id === id) label = it.label;
  document.getElementById('crumb').textContent = label;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
  if (typeof onPageEnter === 'function') onPageEnter(id);
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleTheme() {
  STATE.theme = STATE.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.getElementById('themeIcon').className = 'ti ' + (STATE.theme === 'light' ? 'ti-sun' : 'ti-moon');
}

/* ============== UTILITIES ============== */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function highlightXml(xml) {
  return esc(xml)
    .replace(/(&lt;\/?[\w\-:.]+)/g, '<span class="t">$1</span>')
    .replace(/([\w\-]+)=(&quot;[^&]*?&quot;)/g, '<span class="a">$1</span>=<span class="s">$2</span>')
    .replace(/(&lt;!--.*?--&gt;)/g, '<span class="c">$1</span>');
}
function highlightJs(code) {
  return esc(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/\b(var|let|const|function|if|else|for|while|return|new|true|false|null|import|from|class|throw|try|catch|public|static|void)\b/g, '<span class="k">$1</span>')
    .replace(/("[^"]*"|'[^']*')/g, '<span class="s">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="n">$1</span>');
}
function highlightBash(code) {
  return esc(code)
    .replace(/(#[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/(-[a-zA-Z]\b|--[\w\-]+)/g, '<span class="k">$1</span>')
    .replace(/("[^"]*"|'[^']*')/g, '<span class="s">$1</span>');
}

/* ============== PAGE REGISTRY ============== */
const PAGES = {};
function registerPage(id, html) {
  const wrap = document.getElementById('pages');
  const div = document.createElement('div');
  div.id = 'page-' + id;
  div.className = 'page';
  div.innerHTML = html;
  wrap.appendChild(div);
}

/* ============== EXPAND HELPER ============== */
function toggleExpand(node) {
  node.closest('.expand').classList.toggle('open');
}

/* placeholder for per-page init */
function onPageEnter(id) {
  if (id === 'threadgroups' && typeof initThreadVisualizer === 'function') initThreadVisualizer();
  if (id === 'controllers' && typeof initControllerSim === 'function') initControllerSim();
  if (id === 'listeners' && typeof initListenerDemo === 'function') initListenerDemo();
  if (id === 'timers' && typeof initTimerCompare === 'function') initTimerCompare();
  if (id === 'assertions' && typeof initAssertionTester === 'function') initAssertionTester();
  if (id === 'postprocs' && typeof initExtractorPlayground === 'function') initExtractorPlayground();
  if (id === 'functions' && typeof initFunctionPlayground === 'function') initFunctionPlayground();
  if (id === 'builder' && typeof initBuilder === 'function') initBuilder();
  if (id === 'recording' && typeof initCorrelationDemo === 'function') initCorrelationDemo();
  if (id === 'paramz' && typeof initCsvVisualizer === 'function') initCsvVisualizer();
  if (id === 'cli' && typeof initCliBuilder === 'function') initCliBuilder();
  if (id === 'quiz' && typeof initQuiz === 'function') initQuiz();
  if (id === 'glossary' && typeof initGlossary === 'function') initGlossary();
}
</script>
<script>

registerPage('home', `

    <h1>Apache JMeter Mastery</h1>

      <div class="stat"><strong>10</strong><span>Timers</span></div>

  <h2 style="font-size:18px;margin:28px 0 12px;">14-Day Learning Path</h2>
  <div class="grid grid-2">
    ${[
      ['Day 1','Fundamentals','What JMeter is, its architecture, GUI vs non-GUI, JMX file basics.','fundamentals'],
      ['Day 2','Thread Groups','Standard thread group properties; play with the visualizer.','threadgroups'],

  <div class="callout callout-tip" style="margin-top:24px;">

registerPage('fundamentals', `
  <div class="page-header">
    <h1 class="page-title"><i class="ti ti-book-2"></i> JMeter Fundamentals</h1>
    <p class="page-subtitle">Architecture, execution lifecycle, scope rules, JMX structure, and the small but critical syntax distinctions that separate beginners from practitioners.</p>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <div class="card-icon icon-blue"><i class="ti ti-info-circle"></i></div>
      <h3>What is JMeter?</h3>
      <p>Apache JMeter is an open-source Java application built to load-test functional behavior and measure performance. Originally designed for web apps, it now drives HTTP, FTP, JDBC, JMS, SOAP, REST, GraphQL, TCP, SMTP, LDAP, and arbitrary Java code through samplers.</p>
      <p style="margin-top:8px;">It is <em>not</em> a browser — it parses HTTP responses but does not execute JavaScript. For browser-level testing, pair with Selenium or use BlazeMeter's Taurus.</p>
    </div>
    <div class="card">
      <div class="card-icon icon-purple"><i class="ti ti-stack-2"></i></div>
      <h3>Architecture</h3>
      <p>A <strong>Test Plan</strong> is a tree of elements (hashtree). The <strong>StandardJMeterEngine</strong> walks the tree, instantiates one <strong>ThreadGroup</strong> per group node, which spawns <strong>JMeterThread</strong> objects (one per virtual user). Each thread executes its assigned subtree of samplers, applying timers/assertions/processors at each step.</p>
    </div>
    <div class="card">
      <div class="card-icon icon-green"><i class="ti ti-device-desktop"></i></div>
      <h3>GUI vs Non-GUI Mode</h3>
      <p><strong>GUI mode</strong> (<code class="inline">jmeter</code>) is for designing and debugging your plan only. It is heavy on memory, redraws listeners on every sample, and skews timings.</p>
      <p style="margin-top:8px;"><strong>Non-GUI / CLI mode</strong> (<code class="inline">jmeter -n -t plan.jmx -l out.jtl</code>) is for actual load tests. Lower memory, no rendering, accurate metrics. <strong>Rule:</strong> design in GUI, run in CLI.</p>
    </div>
    <div class="card">
      <div class="card-icon icon-amber"><i class="ti ti-file-code"></i></div>
      <h3>JMX File Structure</h3>
      <p>A <code class="inline">.jmx</code> file is XML serialized from JMeter's element tree. Each element pairs with a <code class="inline">&lt;hashTree&gt;</code> that holds its children. Properties are stored as <code class="inline">&lt;stringProp&gt;</code>, <code class="inline">&lt;boolProp&gt;</code>, <code class="inline">&lt;intProp&gt;</code>, etc.</p>
      <pre class="code">${highlightXml(`<jmeterTestPlan version="1.2">
  <hashTree>
    <TestPlan>...</TestPlan>
    <hashTree>
      <ThreadGroup>...</ThreadGroup>
      <hashTree>
        <HTTPSamplerProxy>...</HTTPSamplerProxy>
        <hashTree/>
      </hashTree>
    </hashTree>
  </hashTree>
</jmeterTestPlan>`)}</pre>
    </div>
  </div>

  <h2 style="font-size:18px;margin:24px 0 12px;">Execution Lifecycle</h2>
  <div class="card">
    <svg class="svg-canvas" viewBox="0 0 900 220" style="height:auto;">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z" fill="var(--text-muted)"/>
        </marker>
      </defs>
      ${['Load .jmx','Resolve fns/props','setUp TG','Main TGs ramp-up','Iteration loop','Sampler exec','Post-procs + Assert','Listeners record','tearDown TG','Aggregate report'].map((label, i) => {
        const x = 30 + i * 86;
        return `
          <rect x="${x}" y="80" width="80" height="46" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
          <text x="${x+40}" y="100" text-anchor="middle" font-size="9.5" fill="var(--accent-text)" font-weight="600">${label.split(' ')[0]}</text>
          <text x="${x+40}" y="113" text-anchor="middle" font-size="9.5" fill="var(--accent-text)">${label.split(' ').slice(1).join(' ')}</text>
          ${i < 9 ? `<line x1="${x+82}" y1="103" x2="${x+86}" y2="103" stroke="var(--text-muted)" stroke-width="1.5" marker-end="url(#arr)"/>` : ''}
        `;
      }).join('')}
      <text x="450" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">JMeter Execution Lifecycle</text>
      <text x="450" y="60" text-anchor="middle" font-size="11" fill="var(--text-muted)">Properties resolve once · Variables resolve per-thread per-iteration</text>
      <rect x="30" y="160" width="166" height="36" rx="6" fill="var(--success-soft)" stroke="var(--success)"/>
      <text x="113" y="183" text-anchor="middle" font-size="11" fill="var(--success)">setUp runs FIRST, sequentially</text>
      <rect x="710" y="160" width="160" height="36" rx="6" fill="var(--danger-soft)" stroke="var(--danger)"/>
      <text x="790" y="183" text-anchor="middle" font-size="11" fill="var(--danger)">tearDown runs LAST</text>
    </svg>
  </div>

  <h2 style="font-size:18px;margin:24px 0 12px;">Scoping Rules</h2>
  <div class="callout callout-info">
    <i class="ti ti-info-circle"></i>
    <div><strong>The scope of a configuration / timer / assertion / pre-/post-processor is its siblings AND all of their children.</strong> If you attach a timer to a Thread Group, it applies before <em>every</em> sampler in that group. If you attach it to a single sampler, only that sampler is delayed.</div>
  </div>
  <table class="tbl">
    <thead><tr><th>Element Type</th><th>Scope Behavior</th><th>Order of Execution</th></tr></thead>
    <tbody>
      <tr><td>Config Elements</td><td>Apply to all siblings and their children. Merged into the sample context.</td><td>Initialized first, before anything else in scope.</td></tr>
      <tr><td>Pre-Processors</td><td>Execute before each sampler in scope.</td><td>Run after timers? <strong>No</strong> — pre-procs run BEFORE timers.</td></tr>
      <tr><td>Timers</td><td>Pause the thread before each sampler in scope.</td><td>Run after pre-procs, before the sampler.</td></tr>
      <tr><td>Samplers</td><td>Generate the actual request/result.</td><td>The work of the test.</td></tr>
      <tr><td>Post-Processors</td><td>Run after each sampler in scope, before assertions.</td><td>Typically extract data into variables.</td></tr>
      <tr><td>Assertions</td><td>Run after post-processors, mark sample pass/fail.</td><td>Cheap ones first — short-circuit if you can.</td></tr>

  <h2 style="font-size:18px;margin:24px 0 12px;">Variables vs Properties</h2>

  <h2 style="font-size:18px;margin:24px 0 12px;">Function vs Variable Syntax</h2>
  <table class="tbl">

    <tbody>
      <tr><td><code class="inline">\${userId}</code></td><td>Variable reference</td><td>Per sample, on the running thread</td></tr>

      <tr><td><code class="inline">\${__P(env,prod)}</code></td><td>Property lookup with default</td><td>On each evaluation; reads JVM properties</td></tr>

function filterList(prefix) {
  if (prefix === 'tg') renderThreadGroups();

  if (prefix === 'tm') renderTimers();

  if (prefix === 'pre') renderPreProcs();
  if (prefix === 'post') renderPostProcs();
  if (prefix === 'cfg') renderConfigs();

}

function initThreadVisualizer() {
  const filters = document.getElementById('tgFilters');

function setFilter(prefix, el) {
  el.parentElement.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filterList(prefix);
}
function drawThreadGraph() {
  const N = +document.getElementById('tgThreads').value;
  const R = +document.getElementById('tgRamp').value;
  const D = +document.getElementById('tgDur').value;
  const Del = +document.getElementById('tgDelay').value;
  document.getElementById('tgThreadsVal').textContent = N;
  document.getElementById('tgRampVal').textContent = R;
  document.getElementById('tgDurVal').textContent = D;
  document.getElementById('tgDelayVal').textContent = Del;
  document.getElementById('tgPeak').textContent = N;
  document.getElementById('tgRate').textContent = R > 0 ? (N/R).toFixed(2) : '∞';
  const W = 600, H = 280, pad = 32;
  const totalT = Math.max(D + Del + 30, 60);
  const xs = t => pad + (W - pad*2) * (t/totalT);
  const ys = u => H - pad - (H - pad*2) * (u/N);
  let path = `M ${xs(0)} ${ys(0)}`;
  path += ` L ${xs(Del)} ${ys(0)}`;
  if (R > 0) path += ` L ${xs(Del+R)} ${ys(N)}`;
  else path += ` L ${xs(Del)} ${ys(N)}`;
  path += ` L ${xs(Del+R+D)} ${ys(N)}`;
  path += ` L ${xs(Del+R+D)} ${ys(0)} Z`;

  const grid = [];
  for (let i = 0; i <= 5; i++) {
    const y = pad + (H-pad*2)*i/5;
    grid.push(`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`);
    grid.push(`<text x="${pad-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-faint)">${Math.round(N*(1-i/5))}</text>`);
  }
  for (let i = 0; i <= 6; i++) {
    const x = pad + (W-pad*2)*i/6;
    grid.push(`<line x1="${x}" y1="${pad}" x2="${x}" y2="${H-pad}" stroke="var(--border)" stroke-width="0.5"/>`);
    grid.push(`<text x="${x}" y="${H-pad+12}" text-anchor="middle" font-size="9" fill="var(--text-faint)">${Math.round(totalT*i/6)}s</text>`);
  }
  document.getElementById('tgSvg').innerHTML = `
    ${grid.join('')}
    <path d="${path}" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>
    <line x1="${xs(Del)}" y1="${pad}" x2="${xs(Del)}" y2="${H-pad}" stroke="var(--warn)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${xs(Del)+4}" y="${pad+12}" font-size="10" fill="var(--warn)">delay end</text>
    <line x1="${xs(Del+R)}" y1="${pad}" x2="${xs(Del+R)}" y2="${H-pad}" stroke="var(--success)" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="${xs(Del+R)+4}" y="${pad+12}" font-size="10" fill="var(--success)">ramp-up end</text>
    <text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">Active users over time</text>
  `;
}

// === PART 4: CONTROLLERS WITH SIMULATOR ===
const CONTROLLERS = [
  { name: 'Simple Controller', short: 'simple', purpose: 'A logical grouping. Adds no behavior — only structure.', props: ['(none)'], pitfalls: ['Does NOT report aggregate timing. Use Transaction Controller for that.'], note: 'Children executed in order, once per outer iteration.',
    example: 'Group "login + 2 calls" under one node without altering execution count.', jmx: '<GenericController testname="Simple"/>' },
  { name: 'Loop Controller', short: 'loop', purpose: 'Executes its children N times per outer iteration.', props: ['Loop Count (or Forever)'],
    pitfalls: ['"Forever" + outer Thread Group "Forever" = no stop until manual stop / duration.','Total samples = parent_iterations × loop_count × children_samples.'],
    example: 'Inside one Thread Group iteration, hit GET /status 10 times.', jmx: '<LoopController><stringProp name="LoopController.loops">10</stringProp></LoopController>' },
  { name: 'While Controller', short: 'while', purpose: 'Run children until the condition becomes "false" (literal string).', props: ['Condition (string) — common: \${VAR}, LAST, function expression'],
    pitfalls: ['Empty/blank condition = treated as LAST (loops until last sample fails).','Condition is evaluated AFTER each iteration, not before — your loop body runs at least once if first eval is true.','Use __jexl3 or __groovy for boolean logic.'],
    example: '${__jexl3("${pollStatus}" != "DONE",)}  — keep polling until DONE.', jmx: '<WhileController><stringProp name="WhileController.condition">${__jexl3("${status}" != "OK",)}</stringProp></WhileController>' },
  { name: 'ForEach Controller', short: 'foreach', purpose: 'Iterates over a set of variables sharing a numeric suffix (var_1, var_2, …) collected by Regex Extractor with match-number 0 or -1.', props: ['Input variable prefix','Start/End index (optional)','Output variable name','Use separator (legacy)'],
    pitfalls: ['Requires variables of the form prefix_1, prefix_2, … contiguous. Gaps stop iteration.','For arbitrary lists, use Regex Extractor with template ($1$) and match-number -1.'],
    example: 'Extract userId_1..userId_N from a search response, then ForEach userId → call /user/${userId}.', jmx: '<ForeachController><stringProp name="ForeachController.inputVal">userId</stringProp><stringProp name="ForeachController.returnVal">u</stringProp></ForeachController>' },
  { name: 'If Controller', short: 'if', purpose: 'Run children only when condition evaluates true.', props: ['Condition','Interpret Condition as Variable Expression (recommended)','Evaluate for all children'],
    pitfalls: ['"Evaluate for all children" re-evaluates condition before each child — usually unnecessary; turn OFF for perf.','Default Javascript engine is slow; check "Interpret Condition as Variable Expression" and use __jexl3 or __groovy.'],
    example: '${__jexl3("${role}" == "admin",)}', jmx: '<IfController><stringProp name="IfController.condition">${__jexl3("${role}"=="admin",)}</stringProp></IfController>' },
  { name: 'Switch Controller', short: 'switch', purpose: 'Run one child whose index (or name) matches the switch value.', props: ['Switch Value (number or child name)'],
    pitfalls: ['Empty switch value runs child #0.','Out-of-range numeric value runs nothing.'],
    example: 'Switch Value = ${userType}. Children named "free", "pro", "enterprise" — only matching one runs.', jmx: '<SwitchController><stringProp name="SwitchController.value">${userType}</stringProp></SwitchController>' },
  { name: 'Random Controller', short: 'random', purpose: 'On each iteration, runs ONE child chosen uniformly at random.', props: ['Ignore sub-controller blocks (treats each as atomic)'],
    pitfalls: ['Pseudo-random — distribution evens out at high N but can be lumpy at low N.','For weighted distribution use Throughput Controller.'],
    example: '4 page samplers as children — each call randomly browses one page.', jmx: '<RandomController/>' },
  { name: 'Random Order Controller', short: 'randorder', purpose: 'Runs ALL children, but in a random order each outer iteration.', props: ['(none)'],
    pitfalls: ['All children still execute — total samples unchanged.','Order may not matter to your server; verify it does before adding this.'],
    example: 'Shuffle the sequence of 5 search queries to avoid caching artifacts.', jmx: '<RandomOrderController/>' },
  { name: 'Interleave Controller', short: 'interleave', purpose: 'Round-robin one child per outer iteration.', props: ['Ignore sub-controller blocks','Interleave accross threads (across-thread synchronization, advanced)'],
    pitfalls: ['Across iterations it cycles A,B,C,A,B,C — useful for spreading traffic.','"Across threads" requires multiple threads to advance properly.'],
    example: 'Cycle thru 3 page types so the test does not hammer one endpoint.', jmx: '<InterleaveControl/>' },
  { name: 'Throughput Controller', short: 'throughput', purpose: 'Limit how often the children execute, by percentage of iterations OR a total executions count.', props: ['Throughput (number)','Style: Percent Executions / Total Executions','Per User (each user has own counter)'],
    pitfalls: ['Misnomer — does NOT cap requests-per-second. That is the job of Constant Throughput Timer / Throughput Shaping Timer.','"Total Executions" with Per User off means a shared counter; race conditions possible at very high concurrency.'],
    example: 'Workload mix: 80% Browse, 20% Checkout → two Throughput Controllers at 80% and 20%.', jmx: '<ThroughputController><intProp name="ThroughputController.style">1</intProp><stringProp name="ThroughputController.percentThrougput">80.0</stringProp></ThroughputController>' },
  { name: 'Runtime Controller', short: 'runtime', purpose: 'Run children until time elapsed (sec) is reached.', props: ['Runtime (seconds)'],
    pitfalls: ['Inner samples that take longer than the remaining budget still complete — soft cap, not hard cut.','Combine with a small While Controller to honor abort tightly.'],
    example: 'Soak: run a loop for 1800s (30 min) regardless of how many iterations fit.', jmx: '<RunTime><stringProp name="RunTime.seconds">1800</stringProp></RunTime>' },
  { name: 'Once Only Controller', short: 'once', purpose: 'Runs its children only on the FIRST iteration of each thread.', props: ['(none)'],
    pitfalls: ['"First iteration per thread", not "first iteration of the test". 100 threads → 100 logins.','If wrapped inside a Loop Controller, it still runs once per OUTER thread iteration, which can surprise.'],
    example: 'Login once per virtual user, then do many transactions.', jmx: '<OnceOnlyController/>' },
  { name: 'Transaction Controller', short: 'txn', purpose: 'Wraps children to produce ONE aggregate sample whose time = sum (or inclusive) of children.', props: ['Generate parent sample (yes/no — controls whether the txn appears as its own row)','Include duration of timer and pre-post processors in generated sample'],
    pitfalls: ['Generate parent sample = OFF: children show up in listeners, txn is virtual; ON: extra row for the aggregate.','If a child fails, txn fails.','Don\'t double-count — pick parent or children, not both, in SLA reports.'],
    example: 'Group login → fetch profile → fetch dashboard as one "Login flow" transaction with end-to-end timing.', jmx: '<TransactionController><boolProp name="TransactionController.parent">true</boolProp><boolProp name="TransactionController.includeTimers">false</boolProp></TransactionController>' },
  { name: 'Module Controller', short: 'module', purpose: 'Points to (and re-uses) another controller subtree elsewhere in the plan, by reference.', props: ['Module to run (tree picker)'],
    pitfalls: ['The referenced tree should normally live under a disabled Thread Group or Test Fragment.','Renaming the referenced node breaks the link.'],
    example: 'A "Login Flow" Test Fragment, reused from 3 different Thread Groups via Module Controllers.', jmx: '<ModuleController><collectionProp name="ModuleController.node_path">…</collectionProp></ModuleController>' },
  { name: 'Include Controller', short: 'include', purpose: 'Loads an external .jmx file at runtime — modular plan composition.', props: ['Include path (must be a single Test Fragment in the included file)'],
    pitfalls: ['Included file must contain exactly one Test Fragment at top level.','Relative paths resolve from where JMeter was launched.'],
    example: 'common-auth.jmx exposes a Test Fragment; multiple plans Include it.', jmx: '<IncludeController><stringProp name="IncludeController.includepath">flows/auth.jmx</stringProp></IncludeController>' },
  { name: 'Critical Section Controller', short: 'critsec', purpose: 'Mutual exclusion: only one thread in the JVM enters the block at a time, keyed by a lock name.', props: ['Lock Name'],
    pitfalls: ['Only inside one JVM — distributed slaves each have their own lock.','Bottlenecks deliberate; do NOT wrap your whole test in this.'],
    example: 'Serialize "claim a unique order number" across virtual users.', jmx: '<CriticalSectionController><stringProp name="CriticalSectionController.lockName">orderNumber</stringProp></CriticalSectionController>' },
];

  SIM = { iter: 0, log: [], counts: [], total: 0, skipped: 0, decisions: 0, running: false, stepIdx: 0, queue: [] };
  document.getElementById('simLog').innerHTML = '';
  document.getElementById('simTotal').textContent = '0';
  document.getElementById('simSkipped').textContent = '0';
  document.getElementById('simDecisions').textContent = '0';
  document.getElementById('simHist').innerHTML = '';
}

function pushEvent(type, msg) {
  SIM.log.push({type, msg});
  const div = document.getElementById('simLog');
  if (div) {
    const e = document.createElement('div');
    e.className = `timeline-event ${type}`;
    e.textContent = msg;
    div.appendChild(e);
    div.scrollTop = div.scrollHeight;
  }
}

function updateHist(children) {
  const W = 400, H = 130, pad = 20;
  const max = Math.max(1, ...SIM.counts);
  const bw = (W - pad*2) / children;
  let bars = '';
  for (let i = 0; i < children; i++) {
    const v = SIM.counts[i] || 0;
    const h = (H - pad*2) * (v/max);
    const x = pad + i*bw + 2;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${bw-4}" height="${h}" class="histogram-bar"/>`;
    bars += `<text x="${x + (bw-4)/2}" y="${y-3}" text-anchor="middle" font-size="10" fill="var(--text)">${v}</text>`;
    bars += `<text x="${x + (bw-4)/2}" y="${H-pad+12}" text-anchor="middle" font-size="10" fill="var(--text-muted)">C${i+1}</text>`;
  }
  document.getElementById('simHist').innerHTML = bars;
}

function buildSimQueue() {
  const ctrl = document.getElementById('simCtrl').value;
  const iters = +document.getElementById('simIter').value;
  const children = +document.getElementById('simChild').value;
  const param = +document.getElementById('simParam').value;
  const q = [];
  q.push({ type: 'enter', msg: `> Begin simulation: ${ctrl} controller, ${iters} outer iter(s), ${children} children` });

  let throughputDone = 0;
  for (let it = 1; it <= iters; it++) {
    q.push({ type: 'enter', msg: `[Iter ${it}] enter controller` });
    switch (ctrl) {
      case 'loop':
        for (let l = 1; l <= param; l++) {
          for (let c = 0; c < children; c++) {
            q.push({ type: 'sample', msg: `  loop ${l}/${param} → sample C${c+1}`, child: c });
          }
        }
        break;
      case 'while':
        let w = 0;
        while (w < param) {
          for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  while iter ${w+1} → C${c+1}`, child: c });
          w++;
          q.push({ type: 'decide', msg: `  evaluate condition → ${w < param ? 'true' : 'false (exit)'}` });
          SIM.decisions++;
        }
        break;
      case 'if':
        const cond = Math.random() * 100 < param;
        q.push({ type: 'decide', msg: `  condition → ${cond}` });
        SIM.decisions++;
        if (cond) for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  C${c+1} runs`, child: c });
        else q.push({ type: 'skip', msg: `  skip all ${children} children`, skip: children });
        break;
      case 'switch':
        const idx = Math.min(param, children-1);
        q.push({ type: 'decide', msg: `  switch value = ${param}, selecting C${idx+1}` });
        SIM.decisions++;
        for (let c = 0; c < children; c++) {
          if (c === idx) q.push({ type: 'sample', msg: `  C${c+1} runs (matched)`, child: c });
          else q.push({ type: 'skip', msg: `  C${c+1} skipped`, skip: 1 });
        }
        break;
      case 'random':
        const r = Math.floor(Math.random() * children);
        q.push({ type: 'decide', msg: `  random → C${r+1}` });
        SIM.decisions++;
        q.push({ type: 'sample', msg: `  C${r+1} runs`, child: r });
        break;
      case 'randorder':
        const order = [...Array(children).keys()].sort(() => Math.random() - 0.5);
        q.push({ type: 'decide', msg: `  randomized order: ${order.map(i=>'C'+(i+1)).join(', ')}` });
        SIM.decisions++;
        for (const c of order) q.push({ type: 'sample', msg: `  C${c+1} runs`, child: c });
        break;
      case 'interleave':
        const ii = (it - 1) % children;
        q.push({ type: 'decide', msg: `  interleave → C${ii+1}` });
        SIM.decisions++;
        q.push({ type: 'sample', msg: `  C${ii+1} runs`, child: ii });
        break;
      case 'throughput':
        const pct = param / 100;
        const expected = Math.floor(it * pct);
        const fire = throughputDone < expected;
        q.push({ type: 'decide', msg: `  throughput ${param}% → ${fire ? 'execute' : 'skip'}` });
        SIM.decisions++;
        if (fire) {
          for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  C${c+1} runs`, child: c });
          throughputDone++;
        } else {
          q.push({ type: 'skip', msg: `  ${children} children skipped`, skip: children });
        }
        break;
      case 'once':
        if (it === 1) for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  C${c+1} runs (first iter)`, child: c });
        else q.push({ type: 'skip', msg: `  Once Only: skipped on iter ${it}`, skip: children });
        break;
      case 'foreach':
        for (let f = 1; f <= param; f++) {
          for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  foreach[${f}] → C${c+1}`, child: c });
        }
        break;
      case 'txn':
        q.push({ type: 'enter', msg: `  txn start` });
        for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `    child C${c+1} runs`, child: c });
        q.push({ type: 'exit', msg: `  txn end → 1 aggregate sample emitted` });
        SIM.counts[children] = (SIM.counts[children] || 0) + 1;
        break;
      case 'critsec':
        q.push({ type: 'enter', msg: `  acquire lock "orderNumber"` });
        for (let c = 0; c < children; c++) q.push({ type: 'sample', msg: `  C${c+1} (locked)`, child: c });
        q.push({ type: 'exit', msg: `  release lock` });
        break;
    }
    q.push({ type: 'exit', msg: `[Iter ${it}] exit controller` });
  }
  q.push({ type: 'enter', msg: `> Simulation complete` });
  return q;
}

async function runCtrlSim(stepMode) {
  resetSim();
  const children = +document.getElementById('simChild').value;
  SIM.counts = new Array(children).fill(0);
  SIM.queue = buildSimQueue();
  SIM.stepIdx = 0;
  if (stepMode) { stepOnce(children); return; }
  const speed = +document.getElementById('simSpeed').value;
  SIM.running = true;
  document.getElementById('simRunBtn').disabled = true;
  while (SIM.stepIdx < SIM.queue.length && SIM.running) {
    stepOnce(children);
    if (speed > 0) await new Promise(r => setTimeout(r, speed));
  }
  document.getElementById('simRunBtn').disabled = false;
}

function stepOnce(children) {
  if (SIM.stepIdx >= SIM.queue.length) return;
  const e = SIM.queue[SIM.stepIdx++];
  pushEvent(e.type, e.msg);
  if (e.type === 'sample' && e.child !== undefined) {
    SIM.counts[e.child] = (SIM.counts[e.child]||0) + 1;
    SIM.total++;
  } else if (e.type === 'skip') {
    SIM.skipped += (e.skip || 0);
  }
  document.getElementById('simTotal').textContent = SIM.total;
  document.getElementById('simSkipped').textContent = SIM.skipped;
  document.getElementById('simDecisions').textContent = SIM.decisions;
  updateHist(children);
}

function resetMock() {
  stopMock();
  MOCK.samples = []; MOCK.byLabel = {}; MOCK.t0 = 0;
  document.getElementById('mockCount').textContent = '0';
  document.getElementById('mockErr').textContent = '0';

  ['gP50','gP95','gP99','gRps','gErr','gAct'].forEach(id => document.getElementById(id).textContent = '-');
}
function startMock() {
  if (MOCK.running) return;
  MOCK.running = true;
  MOCK.t0 = Date.now();
  document.getElementById('lstStart').disabled = true;
  document.getElementById('lstStop').disabled = false;
  MOCK.timer = setInterval(() => {
    const n = 2 + Math.floor(Math.random()*4);
    for (let i = 0; i < n; i++) addMockSample();
    renderMockViews();
  }, 350);
}
function stopMock() {
  MOCK.running = false;
  clearInterval(MOCK.timer);
  document.getElementById('lstStart').disabled = false;
  document.getElementById('lstStop').disabled = true;
}
function addMockSample() {
  const label = MOCK.labels[Math.floor(Math.random()*MOCK.labels.length)];
  // log-normal-ish distribution
  const rt = Math.max(8, Math.round(Math.exp(3.5 + (Math.random()-0.5)*1.8) + (Math.random()<0.05 ? 500 : 0)));
  const ok = Math.random() > 0.03;
  const ts = Date.now() - MOCK.t0;
  const bytes = 400 + Math.floor(Math.random()*8000);
  const s = { label, rt, ok, ts, bytes, thread: 'Users '+(1+Math.floor(Math.random()*10)), code: ok ? 200 : (Math.random()<0.5?500:404) };
  MOCK.samples.push(s);
  if (!MOCK.byLabel[label]) MOCK.byLabel[label] = [];
  MOCK.byLabel[label].push(s);
  document.getElementById('mockCount').textContent = MOCK.samples.length;
  document.getElementById('mockErr').textContent = MOCK.samples.filter(s=>!s.ok).length;
}
function pct(arr, p) {
  if (!arr.length) return 0;
  const sorted = [...arr].sort((a,b)=>a-b);
  return sorted[Math.min(sorted.length-1, Math.floor(sorted.length * p))];
}
function renderMockViews() {

    const recent = MOCK.samples.slice(-50);

function renderTimeSeries(svgId, data, title, color) {
  const svg = document.getElementById(svgId);
  if (!svg || !data.length) { if (svg) svg.innerHTML = '<text x="350" y="130" text-anchor="middle" font-size="13" fill="var(--text-muted)">Start the mock test to see data…</text>'; return; }
  const W = 700, H = 260, pad = 30;
  const xs = data.map(d=>d.x), ys = data.map(d=>d.y);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymax = Math.max(...ys), ymin = 0;
  const sx = x => pad + (W-pad*2) * ((x-xmin)/(Math.max(1, xmax-xmin)));
  const sy = y => H-pad - (H-pad*2) * ((y-ymin)/(Math.max(1, ymax-ymin)));
  let path = `M ${sx(data[0].x)} ${sy(data[0].y)}`;
  for (let i = 1; i < data.length; i++) path += ` L ${sx(data[i].x)} ${sy(data[i].y)}`;
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = pad + (H-pad*2)*i/4;
    grid += `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    grid += `<text x="${pad-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-faint)">${Math.round(ymax*(1-i/4))}</text>`;
  }
  svg.innerHTML = `
    ${grid}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">${title}</text>
  `;
}

function renderDistribution(svgId, values) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  if (!values.length) { svg.innerHTML = '<text x="350" y="130" text-anchor="middle" font-size="13" fill="var(--text-muted)">Start the mock test to see data…</text>'; return; }
  const W = 700, H = 260, pad = 30;
  const max = Math.max(...values);
  const bucketCount = 20;
  const bucketSize = max / bucketCount;
  const buckets = new Array(bucketCount).fill(0);
  for (const v of values) {
    const idx = Math.min(bucketCount-1, Math.floor(v/bucketSize));
    buckets[idx]++;
  }
  const ymax = Math.max(...buckets);
  const bw = (W - pad*2) / bucketCount;
  let bars = '';
  for (let i = 0; i < bucketCount; i++) {
    const h = (H - pad*2) * (buckets[i]/ymax);
    const x = pad + i*bw + 1;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${bw-2}" height="${h}" fill="var(--accent)" opacity="0.75"/>`;
  }
  svg.innerHTML = `
    ${bars}
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>
    <text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">Latency distribution (ms)</text>
    <text x="${pad}" y="${H-pad+14}" font-size="9" fill="var(--text-muted)">0</text>
    <text x="${W-pad}" y="${H-pad+14}" font-size="9" fill="var(--text-muted)" text-anchor="end">${max.toFixed(0)}</text>
  `;
}

function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function poissonRand(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function simTimer() {
  const k = document.getElementById('tmKind').value;
  const a = +document.getElementById('tmA').value;
  const b = +document.getElementById('tmB').value;
  const N = 5000;
  const vals = [];
  for (let i = 0; i < N; i++) {
    let v = 0;
    switch (k) {
      case 'constant': v = a; break;
      case 'gaussian': v = Math.max(0, a + b * gaussian()); break;
      case 'uniform':  v = a + Math.random() * b; break;
      case 'poisson':  v = a + poissonRand(b || 1); break;
      case 'cthroughput': {
        const targetMs = 60000 / Math.max(1,a);
        v = Math.max(0, targetMs + (Math.random()-0.5) * 0.2 * targetMs);
        break;
      }
      case 'pthroughput': {
        const period = Math.max(1,b);
        const target = Math.max(1, a) * period;
        const interval = (period * 1000) / target;
        v = -Math.log(1 - Math.random()) * interval;
        break;
      }
    }
    vals.push(v);
  }
  const mean = vals.reduce((s,x)=>s+x,0)/vals.length;
  const variance = vals.reduce((s,x)=>s+(x-mean)*(x-mean),0)/vals.length;
  const std = Math.sqrt(variance);
  const sorted = [...vals].sort((a,b)=>a-b);
  const p95 = sorted[Math.floor(N*0.95)];
  document.getElementById('tmMean').textContent = mean.toFixed(0);
  document.getElementById('tmStd').textContent = std.toFixed(0);
  document.getElementById('tmMin').textContent = Math.min(...vals).toFixed(0);
  document.getElementById('tmMax').textContent = Math.max(...vals).toFixed(0);
  document.getElementById('tmP95').textContent = p95.toFixed(0);
  document.getElementById('tmTput').textContent = mean > 0 ? (1000/mean).toFixed(2) : '∞';
  // Render histogram
  const max = Math.max(...vals);
  const bc = 25;
  const bw = max/bc;
  const counts = new Array(bc).fill(0);
  for (const v of vals) counts[Math.min(bc-1, Math.floor(v/bw))]++;
  const W = 500, H = 280, pad = 30;
  const ymax = Math.max(...counts);
  const bwpx = (W - pad*2) / bc;
  let bars = '';
  for (let i = 0; i < bc; i++) {
    const h = (H - pad*2) * (counts[i]/ymax);
    const x = pad + i*bwpx + 1;
    const y = H - pad - h;
    bars += `<rect x="${x}" y="${y}" width="${bwpx-2}" height="${h}" fill="var(--warn)" opacity="0.8"/>`;
  }
  const meanX = pad + (W-pad*2) * (mean/max);
  document.getElementById('tmHist').innerHTML = `
    ${bars}
    <line x1="${meanX}" y1="${pad}" x2="${meanX}" y2="${H-pad}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="${meanX+4}" y="${pad+10}" font-size="10" fill="var(--accent)">mean</text>
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>
    <text x="${W/2}" y="14" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text)">Delay distribution (5000 samples)</text>
    <text x="${pad}" y="${H-pad+14}" font-size="9" fill="var(--text-muted)">0 ms</text>
    <text x="${W-pad}" y="${H-pad+14}" font-size="9" fill="var(--text-muted)" text-anchor="end">${max.toFixed(0)} ms</text>
  `;
}

function initAssertionTester() {
  updateAsTester();
  testAssertion();
  renderAssertions();
}

function updateAsTester() {
  const k = document.getElementById('asKind').value;
  const lbl = {
    contains: ['Substring (regex)', null, false],
    equals: ['Exact value', null, false],
    matches: ['Regex (must match whole)', null, false],
    json: ['JSONPath (e.g. $.status)', 'Expected value', false],
    duration: ['Max duration (ms)', null, true],
    size: ['Min size (bytes)', null, false],
    xpath: ['XPath expression (e.g. //items/item)', null, false],
  };
  const [l1,l2,rt] = lbl[k];
  document.getElementById('asParamLbl').textContent = l1;
  document.getElementById('asParam2Wrap').style.display = l2 ? '' : 'none';
  if (l2) document.getElementById('asParam2Lbl').textContent = l2;
  document.getElementById('asRtWrap').style.display = rt ? '' : 'none';
}

function testAssertion() {
  const k = document.getElementById('asKind').value;
  const body = document.getElementById('asBody').value;
  const p = document.getElementById('asParam').value;
  const p2 = document.getElementById('asParam2').value;
  const rt = +document.getElementById('asRt').value;
  let pass = false, explain = '';
  try {
    switch (k) {
      case 'contains':
        pass = new RegExp(p).test(body);
        explain = pass ? `Pattern <code>${esc(p)}</code> found in response.` : `Pattern <code>${esc(p)}</code> not found.`;
        break;
      case 'equals':
        pass = body === p;
        explain = pass ? `Response equals expected value exactly.` : `Response (${body.length} chars) does not equal expected (${p.length} chars).`;
        break;
      case 'matches':
        pass = new RegExp('^' + p + '$', 's').test(body);
        explain = pass ? `Regex <code>${esc(p)}</code> matches the whole response.` : `Regex <code>${esc(p)}</code> does not match whole response. (JMeter's "Matches" requires whole-body match.)`;
        break;
      case 'json':
        const obj = JSON.parse(body);
        const val = jsonPath(obj, p);
        pass = val !== undefined && (p2 === '' || String(val) === p2);
        explain = val === undefined ? `JSON path <code>${esc(p)}</code> not found.` : `JSON path <code>${esc(p)}</code> resolved to <code>${esc(String(val))}</code>. ${p2 ? (pass ? 'Matches expected.' : 'Does not match expected '+esc(p2)+'.') : ''}`;
        break;
      case 'duration':
        pass = rt <= +p;
        explain = pass ? `Sample completed in ${rt}ms, within threshold ${p}ms.` : `Sample took ${rt}ms, exceeds threshold ${p}ms.`;
        break;
      case 'size':
        pass = body.length >= +p;
        explain = pass ? `Body is ${body.length} bytes ≥ ${p}.` : `Body is ${body.length} bytes, below threshold ${p}.`;
        break;
      case 'xpath':
        // simulated: very simple "tag exists" check
        const tag = (p.match(/[\w-]+$/)||[''])[0];
        pass = new RegExp('<' + tag + '[\\s>/]').test(body);
        explain = pass ? `Tag <code>&lt;${esc(tag)}&gt;</code> found.` : `Tag <code>&lt;${esc(tag)}&gt;</code> not found in response.`;
        break;
    }
  } catch (e) {
    pass = false;
    explain = `Error during assertion: ${esc(e.message)}`;
  }
  document.getElementById('asResult').innerHTML = `
    <div class="callout callout-${pass?'tip':'danger'}">
      <i class="ti ${pass?'ti-circle-check':'ti-circle-x'}"></i>
      <div><strong>${pass?'PASS':'FAIL'}.</strong> ${explain}</div>
    </div>
  `;
}

function jsonPath(obj, path) {
  if (!path.startsWith('$')) return undefined;
  const parts = path.replace(/^\$/,'').replace(/\[(\d+)\]/g,'.$1').split('.').filter(Boolean);
  let cur = obj;
  for (const part of parts) {
    if (cur == null) return undefined;
    cur = cur[part];
  }
  return cur;
}

function initExtractorPlayground() {
  loadExSample();
  extractorChange();
  runExtractor();
  renderPostProcs();
  document.getElementById('exMatch').addEventListener('input', () => {
    document.getElementById('exMatchVal').textContent = document.getElementById('exMatch').value;
  });
}
function loadExSample() {
  document.getElementById('exBody').value = EX_SAMPLES[document.getElementById('exSample').value];
}
function extractorChange() {
  const k = document.getElementById('exKind').value;
  const tplWrap = document.getElementById('exTplWrap');
  const rightWrap = document.getElementById('exRightWrap');
  tplWrap.style.display = (k === 'regex') ? '' : 'none';
  rightWrap.style.display = (k === 'boundary') ? '' : 'none';
  const samples = { regex: '"token":"([^"]+)"', json: '$.token', boundary: '"token":"', css: 'a.product-link', xpath: '//item/name' };
  document.getElementById('exPattern').value = samples[k];
  if (k === 'boundary') document.getElementById('exRight').value = '"';
}
function runExtractor() {
  const k = document.getElementById('exKind').value;
  const body = document.getElementById('exBody').value;
  const pat = document.getElementById('exPattern').value;
  const tpl = document.getElementById('exTpl').value;
  const right = document.getElementById('exRight').value;
  const match = +document.getElementById('exMatch').value;
  const r = document.getElementById('exResult');
  try {
    let results = [];
    if (k === 'regex') {
      const re = new RegExp(pat, 'g');
      let m;
      while ((m = re.exec(body)) !== null) {
        const v = tpl.replace(/\$(\d+)\$/g, (_,n)=>m[+n]||'');
        results.push(v);
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    } else if (k === 'json') {
      const obj = JSON.parse(body);
      const val = jsonPath(obj, pat);
      if (Array.isArray(val)) results = val.map(String);
      else if (val !== undefined) results = [String(val)];
    } else if (k === 'boundary') {
      const re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([\\s\\S]*?)' + right.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      let m;
      while ((m = re.exec(body)) !== null) { results.push(m[1]); if (m.index === re.lastIndex) re.lastIndex++; }
    } else if (k === 'css') {
      // very simple CSS: tag or tag.class with optional [attr]
      const cssRe = /^(\w+)?(?:\.([\w-]+))?(?:\[([\w-]+)\])?$/;
      const m = pat.match(cssRe);
      if (m) {
        const [, tag, cls, attr] = m;
        const tagPat = tag ? tag : '\\w+';
        const cre = new RegExp(`<${tagPat}([^>]*?)${cls?`\\bclass=["'][^"']*\\b${cls}\\b[^"']*["']`:''}([^>]*?)>([^<]*)`, 'g');
        let mm;
        while ((mm = cre.exec(body)) !== null) {
          if (attr) {
            const at = new RegExp(`${attr}=["']([^"']+)["']`).exec(mm[1] + mm[2]);
            if (at) results.push(at[1]);
          } else results.push(mm[3]);
        }
      }
    } else if (k === 'xpath') {
      // simplified: support //tag or //parent/child
      const parts = pat.replace(/^\/\//,'').split('/');
      const last = parts[parts.length-1];
      const re = new RegExp(`<${last}>([^<]*)</${last}>`, 'g');
      let m;
      while ((m = re.exec(body)) !== null) results.push(m[1]);
    }
    let output = '';
    if (results.length === 0) {
      output = `<div class="callout callout-warn"><i class="ti ti-alert-triangle"></i><div>No matches. Default value would be used at runtime.</div></div>`;
    } else {
      let chosen;
      if (match === 0) chosen = results[Math.floor(Math.random()*results.length)];
      else if (match === -1) chosen = results;
      else chosen = results[match-1];
      const chosenDisp = chosen === undefined ? '(out of range)' :
        Array.isArray(chosen) ? chosen.map((v,i)=>`<div><code class="inline">var_${i+1}</code> = <code class="inline">${esc(v)}</code></div>`).join('') :
        `<code class="inline">${esc(chosen)}</code>`;
      output = `
        <div class="callout callout-tip"><i class="ti ti-circle-check"></i><div>Found <strong>${results.length}</strong> match(es).</div></div>
        <div style="margin-top:8px;">
          <strong style="font-size:13px;">All matches:</strong>
          <div style="max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;background:var(--bg-alt);margin-top:4px;">
            ${results.map((v,i) => `<div style="font-family:monospace;font-size:12px;padding:2px 0;">[${i+1}] ${esc(v)}</div>`).join('')}
          </div>
          <strong style="font-size:13px;display:block;margin-top:10px;">For match number = ${match} (${match===0?'random':match===-1?'all matches as var_1, var_2, …':'specific match'}):</strong>
          <div style="margin-top:4px;">${chosenDisp}</div>
        </div>
      `;
    }
    r.innerHTML = output;
  } catch (e) {
    r.innerHTML = `<div class="callout callout-danger"><i class="ti ti-circle-x"></i><div>Error: ${esc(e.message)}</div></div>`;
  }
}

const FN_VARS = { userId: '42', name: 'alice', token: 'abc123', role: 'admin', env: 'staging', host: 'api.example.com', n: '10', template: 'https://${host}/api' };

function evalFn() {
  const name = document.getElementById('fnPick').value;
  const args = Array.from(document.querySelectorAll('.fnp')).map(i => i.value);
  let out;
  try {
    out = simulateFunction(name, args);
  } catch (e) {
    out = `(error: ${e.message})`;
  }
  document.getElementById('fnResult').textContent = String(out);
}

function expandVars(s) {
  return String(s).replace(/\$\{(\w+)\}/g, (_,k) => FN_VARS[k] ?? '');
}

function simulateFunction(name, args) {
  const a = args.map(expandVars);
  switch (name) {
    case '__threadNum': return '1';
    case '__samplerName': return '(current sampler)';
    case '__machineName': return 'jmeter-host';
    case '__machineIP': return '192.168.1.10';
    case '__TestPlanName': return 'demo-plan';
    case '__V': return FN_VARS[a[0]] ?? '';
    case '__evalVar': return expandVars(FN_VARS[a[0]] ?? '');
    case '__eval': return expandVars(a[0]);
    case '__isVarDefined': return (FN_VARS[a[0]] !== undefined).toString();
    case '__Random': return String(Math.floor(Math.random() * (+a[1] - +a[0] + 1)) + +a[0]);
    case '__RandomString': {
      const len = +a[0] || 8;
      const chars = a[1] || 'abcdefghijklmnopqrstuvwxyz';
      let r = '';
      for (let i = 0; i < len; i++) r += chars[Math.floor(Math.random()*chars.length)];
      return r;
    }
    case '__RandomDate': {
      const start = new Date(a[1] || '2024-01-01').getTime();
      const end = new Date(a[2] || '2024-12-31').getTime();
      const d = new Date(start + Math.random() * (end - start));
      return d.toISOString().slice(0,10);
    }
    case '__RandomFromMultipleVars': {
      const opts = (a[0]||'').split('|');
      return opts[Math.floor(Math.random()*opts.length)];
    }
    case '__counter': { window._ctr = (window._ctr || 0) + 1; return String(window._ctr); }
    case '__intSum': case '__longSum': return String(a.slice(0,-1).reduce((s,x) => s + (+x||0), 0));
    case '__dec': { const v = (+FN_VARS[a[0]] || 0) - 1; FN_VARS[a[0]] = String(v); return String(v); }
    case '__digest': {
      // simple non-crypto hash for demo
      let h = 0; for (const c of a[1]) h = ((h<<5)-h+c.charCodeAt(0))|0;
      const hex = Math.abs(h).toString(16);
      return (a[3]==='true'?hex.toUpperCase():hex) + ' (simulated; real digest uses '+a[0]+')';
    }
    case '__char': return a.map(c => String.fromCharCode(+c)).join('');
    case '__changeCase': return a[1]==='UPPER'?a[0].toUpperCase():a[1]==='LOWER'?a[0].toLowerCase():a[0].replace(/^./, c=>c.toUpperCase());
    case '__escapeHtml': return a[0].replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    case '__unescapeHtml': return a[0].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    case '__escapeOroRegexpChars': return a[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    case '__urlencode': return encodeURIComponent(a[0]).replace(/%20/g,'+');
    case '__urldecode': return decodeURIComponent(a[0].replace(/\+/g,'%20'));
    case '__regexFunction': {
      const m = new RegExp(a[0]).exec(a[5] || 'sample {"name":"alice","id":42}');
      if (!m) return a[4] || '';
      return a[1].replace(/\$(\d+)\$/g, (_,n)=>m[+n]||'');
    }
    case '__split': {
      const parts = a[0].split(a[2]||',');
      parts.forEach((p,i) => FN_VARS[`${a[1]}_${i+1}`] = p);
      return parts.length + ' parts → ' + parts.map((p,i)=>`${a[1]}_${i+1}=${p}`).join(', ');
    }
    case '__substring': return a[0].substring(+a[1], +a[2]);
    case '__unescape': return a[0].replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\r/g,'\r');
    case '__FileToString': return '(would read entire file ' + a[0] + ')';
    case '__StringFromFile': return '(would read one line from ' + a[0] + ')';
    case '__CSVRead': return '(value from ' + a[0] + ' col ' + a[1] + ')';
    case '__XPath': return '(XPath result on ' + a[0] + ')';
    case '__property': return FN_VARS[a[0]] || a[2] || '';
    case '__P': return FN_VARS[a[0]] || a[1] || '';
    case '__setProperty': FN_VARS[a[0]] = a[1]; return a[2]==='true'?'(old value returned)':'';
    case '__log': console.log(a[1]||'INFO', a[0]); return a[0];
    case '__logn': console.log(a[1]||'INFO', a[0]); return '';
    case '__isPropDefined': return (FN_VARS[a[0]] !== undefined).toString();
    case '__time': {
      const fmt = a[0] || '';
      const now = new Date();
      if (!fmt) return String(now.getTime());
      return fmt.replace(/yyyy/g,now.getFullYear()).replace(/MM/g,String(now.getMonth()+1).padStart(2,'0')).replace(/dd/g,String(now.getDate()).padStart(2,'0')).replace(/HH/g,String(now.getHours()).padStart(2,'0')).replace(/mm/g,String(now.getMinutes()).padStart(2,'0')).replace(/ss/g,String(now.getSeconds()).padStart(2,'0'));
    }
    case '__timeShift': {
      const base = a[1] ? new Date(a[1]) : new Date();
      const shift = a[2] || 'P0D';
      // simple parsing: P<n>D or PT<n>H
      const m = /^P(?:T)?(\d+)([DHM])/.exec(shift);
      if (m) {
        const n = +m[1], u = m[2];
        if (u==='D') base.setDate(base.getDate()+n);
        if (u==='H') base.setHours(base.getHours()+n);
        if (u==='M') base.setMinutes(base.getMinutes()+n);
      }
      return base.toISOString().slice(0,10);
    }
    case '__dateTimeConvert': case '__formatDate':
      return a[0] + ' → (converted, simulated)';
    case '__jexl3': case '__groovy': case '__javaScript': case '__BeanShell':
      try { return String(eval(a[0])); } catch (e) { return '(eval error: ' + e.message + ')'; }
    case '__if':
      return a[0] === 'true' || a[0] === '1' ? a[1] : a[2];
    case '__UUID': return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
    case '__chooseRandom': return a.slice(0,-1)[Math.floor(Math.random()*(a.length-1))];
    case '__strLen': return String(a[0].length);
    default: return '(not simulated)';
  }
}

let TREE = null;
let SELECTED = null;
let NID = 0;

function nid() { return ++NID; }

function defaultTree() {
  return {
    id: nid(), kind: 'plan', label: 'Test Plan', icon: 'ti-file', children: [
      { id: nid(), kind: 'tg', label: 'Users', icon: 'ti-versions', threads: 10, ramp: 30, loops: 1, children: [
